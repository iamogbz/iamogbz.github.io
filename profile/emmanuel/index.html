    <script>
      const ARTWORK_SRC_TOP = "/assets/images/sky_cutout-optimised.png";
      const ARTWORK_SRC_MID = "/assets/images/grass_cutout-optimised.png";
      const ARTWORK_SRC_END = "/assets/images/table_cutout-optimised.png";
      const SKY_PARALLAX = 0.6;
      const GRASS_PARALLAX = 0.8;
      const TABLE_PARALLAX = 1.0;
      const PARALLAX_WH_ASPECT_RATIO = 432 / 768;

      class ParallaxArtExplorer extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: "open" });
          this._ticking = false;
          this._scrollProgress = 0;
        }

        connectedCallback() {
          this.render();
          this.cacheElements();
          this.setupEvents();
          this.setupTimers();
        }

        disconnectedCallback() {
          this._scrollWrapper.removeEventListener("touchmove", this._scrollListener);
          this._scrollWrapper.removeEventListener("scroll", this._scrollListener);
          window.removeEventListener("resize", this._scrollListener);
          window.removeEventListener("orientationchange", this._scrollListener);
          this._scrollContent.querySelectorAll(".highlight-guide").forEach((elem) => {
            elem.removeEventListener("pointerenter", this._pointerMoveListener);
            elem.removeEventListener("pointermove", this._pointerMoveListener);
            elem.removeEventListener("pointerdown", this._pointerMoveListener);
            elem.removeEventListener("pointerleave", this._pointerLeaveListener);
            elem.removeEventListener("pointercancel", this._pointerLeaveListener);
          });
        }

        cacheElements() {
          this._scrollWrapper = this.shadowRoot.getElementById("scroll-wrapper");
          this._scrollContent = this.shadowRoot.getElementById("scroll-content");
          this._scrollFrame = this.shadowRoot.getElementById("scroll-frame");
          this._skyLayer = this.shadowRoot.getElementById("layer-sky");
          this._midLayer = this.shadowRoot.getElementById("layer-mid");
          this._foreLayer = this.shadowRoot.getElementById("layer-fore");
        }

        setupEvents() {
          this._scrollContent.querySelectorAll(".highlight-guide").forEach((elem) => {
            elem.addEventListener("pointerenter", this._pointerMoveListener);
            elem.addEventListener("pointermove", this._pointerMoveListener);
            elem.addEventListener("pointerdown", this._pointerMoveListener);
            elem.addEventListener("pointerleave", this._pointerLeaveListener);
            elem.addEventListener("pointercancel", this._pointerLeaveListener);
          });
          window.addEventListener("orientationchange", this._scrollListener);
          window.addEventListener("resize", this._scrollListener);
          this._scrollWrapper.addEventListener("scroll", this._scrollListener, { passive: true });
          this.updateScroll();
        }

        setupTimers() {
          const disnumberElement = this.shadowRoot.getElementById("disnumber-text");
          this.disnumberIntervalId = setInterval(() => {
            if (!disnumberElement) return window.clearInterval(this.disnumberIntervalId);
            const timeDigitsRandomised = Array.from(new Set(new Date().toTimeString().substring(0, 8).replace(/\:/g, "") + "0123456789"))
              .slice(0, 4)
              .sort(() => Math.random() - 0.5)
              .join(" ");
            disnumberElement.innerText = timeDigitsRandomised;
          }, 600);
        }

        _scrollListener = (e) => {
          if (!this._ticking) {
            requestAnimationFrame(() => {
              this.updateScroll(e);
              this._ticking = false;
            });
            this._ticking = true;
          }
        };

        /**
         * @param {PointerEvent} e
         */
        _pointerMoveListener = (e) => {
          /** @type {HTMLDivElement} */
          const targetElem = this.shadowRoot.getElementById(e.target.dataset.targetId);
          if (!targetElem) return;
          targetElem.style.opacity = 1;
        };

        /**
         * @param {PointerEvent} e
         */
        _pointerLeaveListener = (e) => {
          /** @type {HTMLDivElement} */
          const targetElem = this.shadowRoot.getElementById(e.target.dataset.targetId);
          if (!targetElem) return;
          targetElem.style.opacity = 0;
        };

        /**
         * @param {ScrollEvent} e
         */
        updateScroll(e) {
          const scrollFrame = this._scrollContent;
          if (!scrollFrame) return;
          const scrollable = scrollFrame.scrollHeight - window.innerHeight;
          if (scrollable <= 0) return;
          const containerUsedForScrollingDomRect = scrollFrame.getBoundingClientRect();
          const scrollProgress = -containerUsedForScrollingDomRect.top / scrollable;
          const lastLayerRect = this._foreLayer.getBoundingClientRect();
          // used to give some extra space at the bottom for possible footer items;
          const extraBottomHeight = 0 * window.innerWidth;
          const maxDyPxBase = Math.max(0, lastLayerRect.height - window.innerHeight);
          const maxDyPx = maxDyPxBase + extraBottomHeight;
          const BLUR_PX = 9;

          if (this._skyLayer) {
            const skyScrollDy = scrollProgress * maxDyPx * SKY_PARALLAX;
            this._skyLayer.style.transform = `translateY(${Math.min(0, -skyScrollDy)}px)`;
            const bgBlur = scrollProgress + 0.5 * BLUR_PX;
            this._skyLayer.style.backdropFilter = `blur(${bgBlur}px)`;
          }
          if (this._midLayer) {
            const midScrollDy = scrollProgress * maxDyPx * GRASS_PARALLAX;
            this._midLayer.style.transform = `translateY(${Math.min(0, -midScrollDy)}px)`;
            const bgBlur = Math.max(0, scrollProgress - SKY_PARALLAX) * BLUR_PX;
            this._midLayer.style.backdropFilter = `blur(${bgBlur}px)`;
          }
          if (this._foreLayer) {
            const endScrollDy = scrollProgress * maxDyPx * TABLE_PARALLAX;
            this._foreLayer.style.transform = `translateY(${Math.min(0, -endScrollDy)}px)`;
            const bgBlur = Math.max(0, scrollProgress - GRASS_PARALLAX) * BLUR_PX;
            this._foreLayer.style.backdropFilter = `blur(${bgBlur}px)`;
          }
        }
