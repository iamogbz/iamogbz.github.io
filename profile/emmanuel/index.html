  <body tabindex="-1">
    <parallax-art-explorer id="art-explorer"></parallax-art-explorer>

    <script>
      const BACKGROUND_SRC = "/assets/images/full_site-optimised.png";
      const ARTWORK_SRC_TOP = "/assets/images/sky_cutout-optimised.png";
      const ARTWORK_SRC_MID = "/assets/images/grass_cutout-optimised.png";
      const ARTWORK_SRC_END = "/assets/images/table_cutout-optimised.png";
      const SKY_PARALLAX = 0.5;
      const GRASS_PARALLAX = 0.8;
      const TABLE_PARALLAX = 1.0;
      const PARALLAX_WH_ASPECT_RATIO = 432 / 768;
      const WELCOME_MESSAGE = "Welcome to my world";

      class ParallaxArtExplorer extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: "open" });
          this._ticking = false;
          this._scrollProgress = 0;
          this._pointerX = window.innerWidth / 2;
          this._pointerY = window.innerHeight / 2;
          this._dotX = window.innerWidth / 2;
          this._dotY = window.innerHeight / 2;
          this._cursorAnimId = null;
        }

        connectedCallback() {
          this.render();
          this.cacheElements();
          this.setupEvents();
          this.setupTimers();
          this.awaitAssetsLoaded();
          this.initCursorBubble();
        }

        disconnectedCallback() {
          if (this._cursorAnimId) {
            cancelAnimationFrame(this._cursorAnimId);
          }
          window.removeEventListener("pointermove", this._globalPointerMoveListener);
          this._scrollWrapper.removeEventListener("touchmove", this._scrollListener);
          this._scrollWrapper.removeEventListener("scroll", this._scrollListener);
          window.removeEventListener("resize", this._scrollListener);
          window.removeEventListener("orientationchange", this._scrollListener);
          this._scrollContent.querySelectorAll(".highlight-guide").forEach((elem) => {
            elem.removeEventListener("pointerenter", this._pointerMoveListener);
            elem.removeEventListener("pointermove", this._pointerMoveListener);
            elem.removeEventListener("pointerdown", this._pointerMoveListener);
            elem.removeEventListener("pointerleave", this._pointerLeaveListener);
            elem.removeEventListener("pointercancel", this._pointerLeaveListener);
          });
        }

        cacheElements() {
          this._loadingOverlay = this.shadowRoot.getElementById("loading-overlay");
          this._cursorBubble = this.shadowRoot.getElementById("cursor-bubble");
          this._scrollWrapper = this.shadowRoot.getElementById("scroll-wrapper");
          this._scrollContent = this.shadowRoot.getElementById("scroll-content");
          this._scrollFrame = this.shadowRoot.getElementById("scroll-frame");
          this._skyLayer = this.shadowRoot.getElementById("layer-sky");
          this._midLayer = this.shadowRoot.getElementById("layer-mid");
          this._foreLayer = this.shadowRoot.getElementById("layer-fore");
        }

        async awaitAssetsLoaded() {
          const bgSources = [BACKGROUND_SRC, ARTWORK_SRC_TOP, ARTWORK_SRC_MID, ARTWORK_SRC_END];
          const imgSources = Array.from(this.shadowRoot.querySelectorAll("img")).map((img) => img.src);
          const allSources = Array.from(new Set([...bgSources, ...imgSources]));

          const promises = allSources.map(
            (src) =>
              new Promise((resolve) => {
                const img = new Image();
                img.onload = img.onerror = resolve;
                img.src = src;
              })
          );

          await Promise.all(promises);
          if (this._loadingOverlay) {
            this._loadingOverlay.classList.add("loaded");
          }
        }

        initCursorBubble() {
          const bubble = this._cursorBubble;
          if (!bubble) return;

          // Smooth lerp loop for dot cursor following
          const animate = () => {
            const ease = bubble.classList.contains("dot") ? 0.92 : 0.08;
            this._dotX += (this._pointerX - this._dotX) * ease;
            this._dotY += (this._pointerY - this._dotY) * ease;

            bubble.style.transform = `translate3d(${this._dotX}px, ${this._dotY}px, 0) translate(-50%, -50%)`;
            this._cursorAnimId = requestAnimationFrame(animate);
          };
          this._cursorAnimId = requestAnimationFrame(animate);

          // Reveal bubble once loaded, then transform to tiny dot after a short duration
          setTimeout(() => {
            bubble.classList.add("visible");
          }, 300);

          setTimeout(() => {
            bubble.classList.add("dot");
          }, 3000);
        }

        _globalPointerMoveListener = (e) => {
          this._pointerX = e.clientX;
          this._pointerY = e.clientY;
        };

        setupEvents() {
          window.addEventListener("pointermove", this._globalPointerMoveListener, { passive: true });
          this._scrollContent.querySelectorAll(".highlight-guide").forEach((elem) => {
            elem.addEventListener("pointerenter", this._pointerMoveListener);
            elem.addEventListener("pointermove", this._pointerMoveListener);
            elem.addEventListener("pointerdown", this._pointerMoveListener);
            elem.addEventListener("pointerleave", this._pointerLeaveListener);
            elem.addEventListener("pointercancel", this._pointerLeaveListener);
          });
          window.addEventListener("orientationchange", this._scrollListener);
          window.addEventListener("resize", this._scrollListener);
          this._scrollWrapper.addEventListener("scroll", this._scrollListener, { passive: true });
          this.updateScroll();
        }

        setupTimers() {
          const disnumberElement = this.shadowRoot.getElementById("disnumber-text");
          this.disnumberIntervalId = setInterval(() => {
            if (!disnumberElement) return window.clearInterval(this.disnumberIntervalId);
            const timeDigitsRandomised = Array.from(new Set(new Date().toTimeString().substring(0, 8).replace(/\:/g, "") + "0123456789"))
              .slice(0, 4)
              .sort(() => Math.random() - 0.5)
              .join(" ");
            disnumberElement.innerText = timeDigitsRandomised;
          }, 600);
        }

        _scrollListener = (e) => {
          if (!this._ticking) {
            requestAnimationFrame(() => {
              this.updateScroll(e);
              this._ticking = false;
            });
            this._ticking = true;
          }
        };

        /**
         * @param {PointerEvent} e
         */
        _pointerMoveListener = (e) => {
          /** @type {HTMLDivElement} */
          const targetElem = this.shadowRoot.getElementById(e.target.dataset.targetId);
          if (!targetElem) return;
          targetElem.style.opacity = 1;
        };

        /**
         * @param {PointerEvent} e
         */
        _pointerLeaveListener = (e) => {
          /** @type {HTMLDivElement} */
          const targetElem = this.shadowRoot.getElementById(e.target.dataset.targetId);
          if (!targetElem) return;
          targetElem.style.opacity = 0;
        };

        /**
         * @param {ScrollEvent} e
         */
        updateScroll(e) {
          const scrollFrame = this._scrollContent;
          if (!scrollFrame) return;
          const scrollable = scrollFrame.scrollHeight - window.innerHeight;
          if (scrollable <= 0) return;
          const containerUsedForScrollingDomRect = scrollFrame.getBoundingClientRect();
          const scrollProgress = -containerUsedForScrollingDomRect.top / scrollable;
          const lastLayerRect = this._foreLayer.getBoundingClientRect();
          // used to give some extra space at the bottom for possible footer items;
          const extraBottomHeight = 0 * window.innerWidth;
          const maxDyPxBase = Math.max(0, lastLayerRect.height - window.innerHeight);
          const maxDyPx = maxDyPxBase + extraBottomHeight;
          const BLUR_PX = 9;

          if (this._skyLayer) {
            const skyScrollDy = scrollProgress * maxDyPx * SKY_PARALLAX;
            this._skyLayer.style.transform = `translateY(${Math.min(0, -skyScrollDy)}px)`;
            const bgBlur = scrollProgress + 0.5 * BLUR_PX;
            this._skyLayer.style.backdropFilter = `blur(${bgBlur}px)`;
          }
          if (this._midLayer) {
            const midScrollDy = scrollProgress * maxDyPx * GRASS_PARALLAX;
            this._midLayer.style.transform = `translateY(${Math.min(0, -midScrollDy)}px)`;
            const bgBlur = Math.max(0, scrollProgress - SKY_PARALLAX) * BLUR_PX;
            this._midLayer.style.backdropFilter = `blur(${bgBlur}px)`;
          }
          if (this._foreLayer) {
            const endScrollDy = scrollProgress * maxDyPx * TABLE_PARALLAX;
            this._foreLayer.style.transform = `translateY(${Math.min(0, -endScrollDy)}px)`;
            const bgBlur = Math.max(0, scrollProgress - GRASS_PARALLAX) * BLUR_PX;
            this._foreLayer.style.backdropFilter = `blur(${bgBlur}px)`;
          }
        }

        render() {
          this.shadowRoot.innerHTML = `
            <style>
              :host {
                display: block;
                width: 100vw;
                height: 100vh;
                overflow: hidden;
              }

                width: 100vw;
                height: 100vh;
                background-color: #000;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1000;
                transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
              }
              .loading-overlay.loaded {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
              }
              .cursor-bubble {
                position: fixed;
                top: 0;
                left: 0;
                pointer-events: none;
                z-index: 999;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1rem 1.2rem;
                border-radius: 9999px;
                corner-shape: squircle;
                background-color: rgba(255, 255, 255, 0.12);
                border: 1px solid rgba(255, 255, 255, 0.4);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                color: #ffffff;
                font-size: 0.9rem;
                font-weight: 500;
                letter-spacing: 0.05em;
                white-space: nowrap;
                opacity: 0;
                width: 160px;
                height: 16px;
                transform: translate3d(50vw, 50vh, 0) translate(-50%, -50%) scale(0.9);
                transition: corner-shape 0.3s ease-in-out, scale 0.3s ease-in-out, opacity 0.4s ease-in-out, transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), width 0.2s ease-in-out, height 0.4s ease-in-out, padding 0.4s ease-in-out, background-color 0.4s ease-in-out, border-color 0.4s ease-in-out;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
              }
              .cursor-bubble span {
                transition: corner-shape 0.3s ease-in-out, scale 0.4s ease-in-out, opacity 0.4s ease-in-out, transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), width 0.2s ease-in-out, height 0.4s ease-in-out, padding 0.4s ease-in-out, background-color 0.4s ease-in-out, border-color 0.4s ease-in-out;
              }
              .cursor-bubble.visible {
                opacity: 1;
                transform: translate3d(50vw, 50vh, 0) translate(-50%, -50%) scale(1);
              }
              .cursor-bubble.dot {
                padding: 0;
                width: 8px;
                height: 8px;
                min-width: 8px;
                min-height: 8px;
                border-radius: 50%;
                background-color: #ffffff;
                border: 1px solid rgba(255, 255, 255, 0.8);
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
              }
              .cursor-bubble.dot span {
                opacity: 0;
                scale: 0;
              }
              .scroll-container {
                cursor: none;
                position: fixed;
                top: 0;
                width: 100vw;
                height: 100vh;
                display: flex;
                align-items: start;
                justify-content: center;
                overflow: hidden;
                background-image: url('${BACKGROUND_SRC}');
                background-position: center top;
                background-repeat: no-repeat;
                background-size: 160vw;
              }
              .scroll-content-static {
                width: 100vw;
                height: 100vh;
                position: fixed;
                overflow-x: hidden;
                overflow-y: auto;
              }
              .scroll-content-parallax {
                position: relative;
                width: 100vw;
                height: 500vw;
                background-position: center top;
                background-repeat: no-repeat;
                background-size: 100vw;
                overflow: hidden;
              }
              .scroll-content-parallax::after {
                content: '';
                opacity: 0.05;
                transition: opacity 0.15s ease-in-out;
                background-color: black;
                border-radius: 1rem;
                corner-shape: squircle;
                position: absolute;
                right: 0.3rem;
                top: 0.3rem;
                width: 1rem;
                height: calc(100% - 0.6rem);
              }
              .scroll-content-parallax:hover::after {
                opacity: 0.1;
              }
              .layer {
                position: fixed;
                left: 0;
                right: 0;
                top: 0;
                overflow-x: hidden;
                overflow-y: hidden;
                pointer-events: none;
                user-select: none;
                will-change: transform;
                width: 100vw;

                background-position: center bottom;
              }
              .layer * {
                user-select: none;
              }

                height: 94vw;

              }

              }
              .layer-fore::after {
                content: '';

                bottom: -100vmax;
              }
              .highlight-overlay {
                mix-blend-mode: overlay;
                position: absolute;
                transition: opacity 0.15s ease-in-out;
                opacity: 0;
                user-select: none;
              }
              .highlight-guide {
                position: absolute;
                pointer-events: auto;
                cursor: pointer;
                user-select: none;
              }
              #tower-highlight {
                width: 7vw;
                top: 49vw;
                left: 19vw;
                filter: blur(0.25rem);
              }
              #mail-highlight {
                width: 14vw;

              }
              #paint-highlight {

              #paint-splatters {

              }
              .paint-blob {

              .paint-blob.b1 { background: #ff2a6d; width: 1.8vw; height: 1.6vw; top: 22%; left: 35%; border-radius: 68% 32% 54% 46% / 42% 65% 35% 58%; --dx: -2.5vw; --dy: -2.0vw; animation-delay: 0s; animation-duration: 3.8s; }
              .paint-blob.b2 { background: #05d9e8; width: 2.2vw; height: 2.3vw; top: 18%; left: 58%; border-radius: 41% 59% 45% 55% / 59% 38% 62% 41%; --dx: 2.2vw; --dy: -2.8vw; animation-delay: 0.8s; animation-duration: 4.2s; }
              .paint-blob.b3 { background: #ffb703; width: 1.4vw; height: 1.3vw; top: 38%; left: 75%; border-radius: 73% 27% 62% 38% / 34% 69% 31% 66%; --dx: 3.2vw; --dy: -0.8vw; animation-delay: 1.5s; animation-duration: 3.6s; }
              .paint-blob.b4 { background: #7209b7; width: 2.5vw; height: 2.1vw; top: 52%; left: 22%; border-radius: 55% 45% 32% 68% / 61% 43% 57% 39%; --dx: -3.0vw; --dy: 1.5vw; animation-delay: 0.4s; animation-duration: 4.5s; }
              .paint-blob.b5 { background: #00f5d4; width: 1.3vw; height: 1.5vw; top: 66%; left: 42%; border-radius: 39% 61% 70% 30% / 48% 52% 48% 52%; --dx: -0.8vw; --dy: 3.2vw; animation-delay: 2.0s; animation-duration: 3.4s; }
              .paint-blob.b6 { background: #ff5400; width: 1.9vw; height: 1.7vw; top: 48%; left: 68%; border-radius: 64% 36% 47% 53% / 38% 65% 35% 62%; --dx: 2.6vw; --dy: 1.8vw; animation-delay: 1.1s; animation-duration: 4.0s; }
              .paint-blob.b7 { background: #f72585; width: 1.1vw; height: 1.0vw; top: 12%; left: 42%; border-radius: 50% 50% 60% 40% / 40% 60% 40% 60%; --dx: 0.5vw; --dy: -3.5vw; animation-delay: 2.4s; animation-duration: 3.5s; }
              .paint-blob.b8 { background: #4cc9f0; width: 1.6vw; height: 1.9vw; top: 70%; left: 65%; border-radius: 45% 55% 35% 65% / 55% 45% 65% 35%; --dx: 1.8vw; --dy: 2.8vw; animation-delay: 1.7s; animation-duration: 4.3s; }
              .paint-blob.b9 { background: #38b000; width: 1.3vw; height: 1.2vw; top: 32%; left: 16%; border-radius: 60% 40% 55% 45% / 45% 55% 45% 55%; --dx: -3.2vw; --dy: -1.2vw; animation-delay: 2.7s; animation-duration: 3.9s; }

                  transform: translate(calc(var(--dx) * 1.3), calc(var(--dy) * 1.3 + 0.6vw)) scale(0.9) rotate(20deg);

                100% {
                  transform: translate(calc(var(--dx) * 1.6), calc(var(--dy) * 1.6 + 1.5vw)) scale(0.2) rotate(40deg);
