<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emmanuel Ogbizi Ugbe</title>
    <meta name="description" content="My stuff." />
    <meta name="theme-color" content="#000" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background-color: #000;
        background-image: url("/assets/images/full_site.png");
        background-position: center top;
        background-repeat: no-repeat;
        background-size: 160vw;
        color: #fff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow-x: hidden;
        overflow-y: hidden;
        overscroll-behavior: none;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/gh/iamogbz/oh-my-wcs@main/components/github-md-view.js"></script>
  </head>

  <body tabindex="-1">
    <parallax-art-explorer id="art-explorer"></parallax-art-explorer>

    <script>
      const ARTWORK_SRC_TOP = "/assets/images/sky_cutout.png";
      const ARTWORK_SRC_MID = "/assets/images/grass_cutout.png";
      const ARTWORK_SRC_END = "/assets/images/table_cutout.png";
      const SKY_PARALLAX = 0.05;
      const GRASS_PARALLAX = 0.07;
      const TABLE_PARALLAX = 0.1;
      const PARALLAX_WH_ASPECT_RATIO = 432 / 768;

      class ParallaxArtExplorer extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: "open" });
          this._ticking = false;
          this._dimxChangeListener();
        }

        connectedCallback() {
          this.render();
          this.cacheElements();
          this.setupEvents();
        }

        disconnectedCallback() {
          if (this._scrollListener) {
            this._stage.removeEventListener("scroll", this._scrollListener);
          }
          window.removeEventListener("resize", this._dimxChangeListener);
          window.removeEventListener("orientationchange", this._dimxChangeListener);
          this._frame.querySelectorAll(".highlight-guide").forEach((elem) => {
            elem.removeEventListener("pointerenter", this._pointerMoveListener);
            elem.removeEventListener("pointermove", this._pointerMoveListener);
            elem.removeEventListener("pointerdown", this._pointerMoveListener);
            elem.removeEventListener("pointerleave", this._pointerLeaveListener);
            elem.removeEventListener("pointercancel", this._pointerLeaveListener);
          });
        }

        cacheElements() {
          this._stage = this.shadowRoot.getElementById("stage");
          this._frame = this.shadowRoot.getElementById("frame");
          this._skyLayer = this.shadowRoot.getElementById("layer-sky");
          this._midLayer = this.shadowRoot.getElementById("layer-mid");
          this._foreLayer = this.shadowRoot.getElementById("layer-fore");
        }

        setupEvents() {
          this._frame.querySelectorAll(".highlight-guide").forEach((elem) => {
            elem.addEventListener("pointerenter", this._pointerMoveListener);
            elem.addEventListener("pointermove", this._pointerMoveListener);
            elem.addEventListener("pointerdown", this._pointerMoveListener);
            elem.addEventListener("pointerleave", this._pointerLeaveListener);
            elem.addEventListener("pointercancel", this._pointerLeaveListener);
          });
          window.addEventListener("resize", this._dimxChangeListener);
          window.addEventListener("orientationchange", this._dimxChangeListener);
          this._stage.addEventListener("scroll", this._scrollListener, { passive: true });
          this.updateScroll();
        }

        _scrollListener = (e) => {
          if (!this._ticking) {
            requestAnimationFrame(() => {
              this.updateScroll(e);
              this._ticking = false;
            });
            this._ticking = true;
          }
        };

        _dimxChangeListener = () => {
          this._scrollProgress = 0;
          this._scrollBaseline = Number.NEGATIVE_INFINITY;
          setTimeout(() => {
            this._stage?.scrollTo({ top: 0, left: 0, behavior: "smooth" });
          }, 150);
        };

        /**
         * @param {PointerEvent} e
         */
        _pointerMoveListener = (e) => {
          /** @type {HTMLDivElement} */
          const targetElem = this.shadowRoot.getElementById(e.target.dataset.targetId);
          if (!targetElem) return;
          targetElem.style.opacity = 1;
        };

        /**
         * @param {PointerEvent} e
         */
        _pointerLeaveListener = (e) => {
          /** @type {HTMLDivElement} */
          const targetElem = this.shadowRoot.getElementById(e.target.dataset.targetId);
          if (!targetElem) return;
          targetElem.style.opacity = 0;
        };

        /**
         * @param {ScrollEvent} e
         */
        updateScroll(e) {
          if (!this._frame) return;
          const rect = this._frame.getBoundingClientRect();
          if (rect.top > this._scrollBaseline) {
            this._scrollBaseline = rect.top;
          }
          const scrollable = this._frame.scrollHeight - window.innerHeight;
          if (scrollable <= 0) return;
          const scrollProgress = (this._scrollBaseline - rect.top) / (scrollable / 2);
          this._scrollProgress = scrollProgress * scrollable;

          const parallaxMult = (PARALLAX_WH_ASPECT_RATIO * window.innerHeight) / window.innerWidth;
          const BLUR_PX = 9;

          if (this._skyLayer) {
            const skyScrollDy = (this._scrollProgress * SKY_PARALLAX) / parallaxMult;
            this._skyLayer.style.transform = `translateY(-${skyScrollDy}px)`;
            const bgBlur = scrollProgress + 0.5 * BLUR_PX;
            this._skyLayer.style.backdropFilter = `blur(${bgBlur}px)`;
          }
          if (this._midLayer) {
            const midScrollDy = (this._scrollProgress * GRASS_PARALLAX) / parallaxMult;
            this._midLayer.style.transform = `translateY(-${midScrollDy}px)`;
            const bgBlur = Math.max(0, scrollProgress - 0.2) * BLUR_PX;
            this._midLayer.style.backdropFilter = `blur(${bgBlur}px)`;
          }
          if (this._foreLayer) {
            const endScrollDy = (this._scrollProgress * TABLE_PARALLAX) / parallaxMult;
            this._foreLayer.style.transform = `translateY(-${endScrollDy}px)`;
            const bgBlur = Math.max(0, scrollProgress - 0.4) * BLUR_PX;
            this._foreLayer.style.backdropFilter = `blur(${bgBlur}px)`;
          }
        }

        render() {
          this.shadowRoot.innerHTML = `
            <style>
              :host {
                display: block;
                width: 100vw;
                height: 100vh;
                overflow: hidden;
              }
              .sticky-stage {
                position: sticky;
                top: 0;
                width: 100vw;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow-x: hidden;
              }
              .canvas-frame {
                position: absolute;
                width: 100vw;
                height: 1000vw;
                overflow: hidden;
              }
              .layer {
                position: fixed;
                left: 0;
                right: 0;
                top: 0;
                height: 1000vw;
                overflow: hidden;
                pointer-events: none;
                will-change: transform;
                transition: transform 0.15s ease-out;
              }
              .art-bg {
                position: absolute;
                left: 0;
                right: 0;
                width: 100vw;
                height: 1000vw;
                background-repeat: no-repeat;
                background-size: cover;
              }
              .bg-sky {
                top: 0;
                height: 94vw;
                background-position: center top;
                background-image: url('${ARTWORK_SRC_TOP}');
              }
              .bg-mid {
                top: 68vw;
                height: 84vw;
                background-position: center top;
                background-image: url('${ARTWORK_SRC_MID}');
              }
              .bg-fore {
                top: 109vw;
                height: 123vw;
                background-position: center top;
                background-image: url('${ARTWORK_SRC_END}');
              }
              .footer {
                height: 100vh;
                width: 100vw;
                background: white;
                position: absolute;
                top: 232vw;
                display: flex;
                justify-content: center;
                padding: 0.5rem 0;
              }
              .footer github-md-view {
                text-align: center;
              }
              .highlight-overlay {
                mix-blend-mode: overlay;
                position: absolute;
                transition: all 0.15s ease-in-out;
                opacity: 1;
              }
              .highlight-guide {
                position: absolute;
                border: solid 1px red;
                pointer-events: all;
                cursor: pointer;
                user-select: none;
              }
              #tower-highlight {
                width: 7vw;
                top: 48.7vw;
                left: 18.45vw;
                filter: blur(0.25rem);
              }
              #mail-highlight {
                width: 14vw;
                top: 84vw;
                left: 19vw;
                filter: blur(0.125rem);
              }
              #paint-highlight {
                width: 32vw;
                top: 82vw;
                left: 31.4vw;
                filter: blur(0.5rem);
              }
              #phone-highlight {
                top: 101vw;
                left: 8.5vw;
                width: 17vw;
              }
              #shrouded-highlight {
                top: 92vw;
                left: 62vw;
                width: 40vw;
                filter: blur(0.5rem);
              }
            </style>
            <div class="sticky-stage" id="stage">
              <div class="canvas-frame" id="frame">
                <!-- SECTION 1: SKY -->
                <div id="layer-sky" class="layer layer-sky">
                  <div class="art-bg bg-sky"></div>
                  <img src="/assets/images/tower-highlight.png" class="highlight-overlay" id="tower-highlight" />
                  <a href="https://www.google.com/maps/place/CN+Tower+301+Front+St+W+Toronto" target="_blank" id="hotspot-tower" class="highlight-guide" data-target-id="tower-highlight" style="width: 14vw; height: 42vw; top: 40vw; left: 14.5vw;"></a>
                </div>

                <!-- SECTION 2: MIDGROUND -->
                <div id="layer-mid" class="layer layer-mid">
                  <div class="art-bg bg-mid"></div>
                  <img src="/assets/images/mail-highlight.png" class="highlight-overlay" id="mail-highlight" />
                  <img src="/assets/images/phone-highlight.png" class="highlight-overlay" id="phone-highlight" />
                  <img src="/assets/images/paint-highlight.png" class="highlight-overlay" id="paint-highlight" />
                  <img src="/assets/images/shrouded-highlight.png" class="highlight-overlay" id="shrouded-highlight" />
                  <a href="mailto:eogbizi@gmail.com" target="_blank" id="hotspot-mail" class="highlight-guide" data-target-id="mail-highlight" style="width: 16vw; height: 23vw; top: 83vw; left: 18vw;"></a>
                  <a href="tel:+12897005815" target="_blank" id="hotspot-phone" class="highlight-guide" data-target-id="phone-highlight" style="width: 14vw; height: 14vw; top: 102vw; left: 9vw;"></a>
                  <a href="https://paint.ogbizi.com" target="_blank" id="hotspot-paint" class="highlight-guide" data-target-id="paint-highlight" style="width: 30vw; height: 34vw; top: 80vw; left: 32vw;"></a>
                  <a href="./labs" target="_blank" id="hotspot-paint" class="highlight-guide" data-target-id="shrouded-highlight" style="width: 40vw; height: 40vw; top: 90vw; left: 60vw;"></a>
                </div>

                <!-- SECTION 3: FOREGROUND -->
                <div id="layer-fore" class="layer layer-fore">
                  <div class="art-bg bg-fore"></div>
                  <div class="footer">
                    <github-md-view url="/README.md" from="0" to="100"></github-md-view>
                  </div>
                </div>
              </div>
            </div>
          `;
        }
      }

      customElements.define("parallax-art-explorer", ParallaxArtExplorer);
    </script>
  </body>
</html>
