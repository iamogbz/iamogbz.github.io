    <parallax-art-explorer id="art-explorer"></parallax-art-explorer>

    <script>
      const BACKGROUND_SRC = "/assets/images/full_site-optimised.png";
      const ARTWORK_SRC_TOP = "/assets/images/sky_cutout-optimised.png";
      const ARTWORK_SRC_MID = "/assets/images/grass_cutout-optimised.png";
      const ARTWORK_SRC_END = "/assets/images/table_cutout-optimised.png";
      const SKY_PARALLAX = 0.5;
      const GRASS_PARALLAX = 0.8;
      const TABLE_PARALLAX = 1.0;
      const PARALLAX_WH_ASPECT_RATIO = 432 / 768;

      class ParallaxArtExplorer extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: "open" });
          this._ticking = false;
          this._scrollProgress = 0;
        }

        connectedCallback() {
          this.render();
          this.cacheElements();
          this.setupEvents();
          this.setupTimers();
          this.awaitAssetsLoaded();
        }

        disconnectedCallback() {
          this._scrollWrapper.removeEventListener("touchmove", this._scrollListener);
          this._scrollWrapper.removeEventListener("scroll", this._scrollListener);
          window.removeEventListener("resize", this._scrollListener);
          window.removeEventListener("orientationchange", this._scrollListener);
          this._scrollContent.querySelectorAll(".highlight-guide").forEach((elem) => {
            elem.removeEventListener("pointerenter", this._pointerMoveListener);
            elem.removeEventListener("pointermove", this._pointerMoveListener);
            elem.removeEventListener("pointerdown", this._pointerMoveListener);
            elem.removeEventListener("pointerleave", this._pointerLeaveListener);
            elem.removeEventListener("pointercancel", this._pointerLeaveListener);
          });
        }

        cacheElements() {
          this._loadingOverlay = this.shadowRoot.getElementById("loading-overlay");
          this._scrollWrapper = this.shadowRoot.getElementById("scroll-wrapper");
          this._scrollContent = this.shadowRoot.getElementById("scroll-content");
          this._scrollFrame = this.shadowRoot.getElementById("scroll-frame");
          this._skyLayer = this.shadowRoot.getElementById("layer-sky");
          this._midLayer = this.shadowRoot.getElementById("layer-mid");
          this._foreLayer = this.shadowRoot.getElementById("layer-fore");
        }

        async awaitAssetsLoaded() {
          const bgSources = [BACKGROUND_SRC, ARTWORK_SRC_TOP, ARTWORK_SRC_MID, ARTWORK_SRC_END];
          const imgSources = Array.from(this.shadowRoot.querySelectorAll("img")).map((img) => img.src);
          const allSources = Array.from(new Set([...bgSources, ...imgSources]));

          const promises = allSources.map(
            (src) =>
              new Promise((resolve) => {
                const img = new Image();
                img.onload = img.onerror = resolve;
                img.src = src;
              })
          );

          await Promise.all(promises);
          if (this._loadingOverlay) {
            this._loadingOverlay.classList.add("loaded");
          }
        }

        setupEvents() {
          this._scrollContent.querySelectorAll(".highlight-guide").forEach((elem) => {
            elem.addEventListener("pointerenter", this._pointerMoveListener);
            elem.addEventListener("pointermove", this._pointerMoveListener);
            elem.addEventListener("pointerdown", this._pointerMoveListener);
            elem.addEventListener("pointerleave", this._pointerLeaveListener);
            elem.addEventListener("pointercancel", this._pointerLeaveListener);
          });
          this._scrollWrapper.addEventListener("touchmove", this._scrollListener, { passive: true });
          this._scrollWrapper.addEventListener("scroll", this._scrollListener, { passive: true });
          window.addEventListener("resize", this._scrollListener, { passive: true });
          window.addEventListener("orientationchange", this._scrollListener, { passive: true });
        }

        setupTimers() {
          const disnumberEl = this.shadowRoot.getElementById("disnumber-text");
          const updateDisnumber = () => {
            if (disnumberEl) {
              disnumberEl.textContent = new Date().toTimeString().split(" ")[0].replace(/:/g, " ");
            }
          };
          updateDisnumber();
          setInterval(updateDisnumber, 1000);
        }

        _pointerMoveListener = (e) => {
          const target = e.currentTarget;
          const targetId = target?.dataset?.targetId;
          if (targetId) {
            const highlight = this.shadowRoot.getElementById(targetId);
            if (highlight) {
              highlight.classList.add("active");
            }
          }
        };

        _pointerLeaveListener = (e) => {
          const target = e.currentTarget;
          const targetId = target?.dataset?.targetId;
          if (targetId) {
            const highlight = this.shadowRoot.getElementById(targetId);
            if (highlight) {
              highlight.classList.remove("active");
            }
          }
        };

        _scrollListener = (e) => {
          if (!this._ticking) {
            window.requestAnimationFrame(() => {
              this.updateParallax();
              this._ticking = false;
            });
            this._ticking = true;
          }
        };

        updateParallax() {
          const scrollTop = this._scrollWrapper.scrollTop;
          const scrollHeight = this._scrollContent.scrollHeight;
          const clientHeight = this._scrollWrapper.clientHeight;
          const maxScroll = Math.max(scrollHeight - clientHeight, 1);
          this._scrollProgress = Math.min(Math.max(scrollTop / maxScroll, 0), 1);

          const baseOffset = -this._scrollProgress * 250;
          this._skyLayer.style.transform = `translateY(${baseOffset * SKY_PARALLAX}vw)`;
          this._midLayer.style.transform = `translateY(${baseOffset * GRASS_PARALLAX}vw)`;
          this._foreLayer.style.transform = `translateY(${baseOffset * TABLE_PARALLAX}vw)`;

          const bgSizeW = 160;
          const bgSizeH = bgSizeW / PARALLAX_WH_ASPECT_RATIO;
          const viewportW = window.innerWidth;
          const viewportH = window.innerHeight;
          const currentBgW = (bgSizeW / 100) * viewportW;
          const currentBgH = (bgSizeH / 100) * viewportW;
          const maxBgTravel = Math.max(currentBgH - viewportH, 0);
          const bgTranslateY = -this._scrollProgress * maxBgTravel;
          this.style.backgroundPositionY = `${bgTranslateY}px`;
        }

        render() {

            <style>

                background-color: #000;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1000;
                transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
              }
              .loading-overlay.loaded {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
              }
              .scroll-container {
                position: fixed;
                top: 0;
                width: 100vw;
                height: 100vh;
                display: flex;
                align-items: start;
                justify-content: center;
                overflow: hidden;
                background-image: url('${BACKGROUND_SRC}');
                background-position: center top;
                background-repeat: no-repeat;
                background-size: 160vw;
              }
              .scroll-content-static {
                width: 100vw;
                height: 100vh;
                position: fixed;
                overflow-x: hidden;
                overflow-y: auto;
              }
              .scroll-content-parallax {
                position: relative;
                width: 100vw;
                height: 500vw;
                background-position: center top;
                background-repeat: no-repeat;
                background-size: 100vw;
                overflow: hidden;
              }
              .scroll-content-parallax::after {
                content: '';
                opacity: 0.05;

                background-color: black;
                border-radius: 1rem;
                corner-shape: squircle;
                position: absolute;
                right: 0.3rem;
                top: 0.3rem;
                width: 1rem;
                height: calc(100% - 0.6rem);
              }
              .scroll-content-parallax:hover::after {
                opacity: 0.1;
              }
              .layer {
                position: fixed;
                left: 0;
                right: 0;
                top: 0;
                overflow-x: hidden;
                overflow-y: hidden;
                will-change: transform;
                pointer-events: none;
                width: 100vw;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: flex-start;

              .layer-sky, .layer-mid, .layer-fore {
                position: absolute;

                display: flex;
                align-items: center;
                justify-content: center;
                pointer-events: none;

              #disnumber-cover {

              #tiles-highlight {

            </style>
