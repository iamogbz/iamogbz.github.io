<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Domo Ogbizi</title>
    <meta name="description" content="The House of Ogbizi." />
    <meta name="theme-color" content="#000" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background-color: #000;
        background-position: center top;
        background-repeat: no-repeat;
        background-size: cover;
        color: #fff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        overflow-x: hidden;
        overflow-y: hidden;
        overscroll-behavior: none;
      }

      body {
        background-image: url("/assets/images/background.jpg");
      }

      #wrapper {
        background-color: color-mix(in srgb, #000 80%, transparent);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        cursor: pointer;
      }

      #enter-btn {
        text-transform: uppercase;
        text-decoration: none;
        color: white;
        background-color: FFFFFF00;
        corner-shape: superellipse(2);
        border: solid #ffffff00 0.2rem;
        border-radius: 1rem;
        padding: 1rem 2rem;
        text-align: center;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      #enter-btn:hover {
        border-radius: 4rem;
        background-color: #ffffff11;
        border-color: #ffffffff;
      }
    </style>
    <script src="/components/Logo.js"></script>
  </head>
  <body tabindex="-1">
    <div id="wrapper">
      <og-logo width="192px"></og-logo>
      <a id="enter-btn" href="/profile/emmanuel/">ENTER</a>
    </div>
  </body>
</html>
