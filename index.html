<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Domo Ogbizi</title>
    <meta name="description" content="House of Ogbizi." />
    <meta name="theme-color" content="#000" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background-color: #000;
        background-position: center top;
        background-repeat: no-repeat;
        background-size: cover;
        color: #fff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        overflow-x: hidden;
        overflow-y: hidden;
        overscroll-behavior: none;
      }

      body {
        background-image: url("src/assets/images/background.jpg");
      }

      #logo {
        background-color: color-mix(in srgb, #000 80%, transparent);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        cursor: pointer;
      }

      #logo .ring {
        animation: progress 3s linear normal infinite;
        fill: none;
        stroke-dasharray: 720 180;
      }

      #logo .left {
        transform: translate(100px, 0) rotate(90deg);
      }

      #logo .right {
        animation-delay: 1.5s;
        animation-direction: reverse;
        transform: translate(100px, 200px) rotate(-90deg);
      }

      @keyframes progress {
        0%,
        10% {
          stroke-dashoffset: 100;
        }

        90%,
        100% {
          stroke-dashoffset: -900;
        }
      }

      #enter-btn {
        text-transform: uppercase;
        text-decoration: none;
        color: white;
        background-color: FFFFFF00;
        corner-shape: superellipse(2);
        border: solid #ffffff00 0.2rem;
        border-radius: 1rem;
        padding: 1rem 2rem;
        text-align: center;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      #enter-btn:hover {
        border-radius: 4rem;
        background-color: #ffffff11;
        border-color: #ffffffff;
      }
    </style>
  </head>
  <body tabindex="-1">
    <div id="logo">
      <svg
        height="192.60000000000002"
        width="192.60000000000002"
        viewBox="-260 -260 720 720"
      >
        <path
          class="ring left"
          stroke="#f8f4f2"
          stroke-linecap="round"
          stroke-width="32"
          fill-rule="nonzero"
          fill="none"
          d="M100,0 a100,100 0 0 1 0,200 a100,100 0 0 1 0,-200,0"
        ></path>
        <path
          class="ring right"
          stroke="#f8f4f2"
          stroke-linecap="round"
          stroke-width="32"
          fill-rule="nonzero"
          fill="none"
          d="M100,0 a100,100 0 0 1 0,200 a100,100 0 0 1 0,-200,0"
        ></path>
      </svg>
      <a id="enter-btn" href="/profile/emmanuel">VIEW PAGE</a>
    </div>
  </body>
</html>
